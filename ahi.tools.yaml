# Trusted-workspace mode: reads and writes need no prompts. Shell commands
# have your host account's access, can reach outside this workspace, and can
# bypass builtin file protections. This is not a sandbox. Only use this mode
# for workspaces and model-driven actions you trust. Skills and delegation
# still require explicit rules. Commands run through one of the shells below;
# other executable prefixes remain denied.
version: 1
default: deny
rules:
  - id: read-tree
    action: tool_call
    match: {tool: read_file}
    effect: approve
  - id: list-tree
    action: tool_call
    match: {tool: list_dir}
    effect: approve
  - id: find-tree
    action: tool_call
    match: {tool: find_files}
    effect: approve
  - id: search-tree
    action: tool_call
    match: {tool: search_files}
    effect: approve
  - id: edit-tree
    action: file_write
    match: {}
    effect: approve
  - id: shell-sh
    action: command
    match: {argv: [sh]}
    effect: approve
    toolchain_env: [CARGO_TARGET_DIR]
  - id: shell-bash
    action: command
    match: {argv: [bash]}
    effect: approve
    toolchain_env: [CARGO_TARGET_DIR]
  - id: shell-pwsh
    action: command
    match: {argv: [pwsh]}
    effect: approve
  - id: shell-powershell
    action: command
    match: {argv: [powershell]}
    effect: approve
  - id: shell-cmd
    action: command
    match: {argv: [cmd]}
    effect: approve
