# Trusted-workspace mode: reads and writes need no prompts. Shell commands
# have your host account's access, can reach outside this workspace, and can
# bypass builtin file protections. This is not a sandbox. Only use this mode
# for workspaces and model-driven actions you trust. This workspace opts in
# to operator skill reads and to running scripts bundled with operator or repo
# skills. Repo skill reads through load_skill and delegation remain denied.
# Ordinary commands run through one of the shells below.
version: 1
default: deny
rules:
  - id: read-tree
    action: tool_call
    match: {tool: read_file}
    effect: approve
  - id: list-tree
    action: tool_call
    match: {tool: list_dir}
    effect: approve
  - id: find-tree
    action: tool_call
    match: {tool: find_files}
    effect: approve
  - id: search-tree
    action: tool_call
    match: {tool: search_files}
    effect: approve
  - id: edit-tree
    action: file_write
    match: {}
    effect: approve
  # Read operator skill instructions and bounded supporting files, not execute them.
  - id: operator-skills
    action: skill
    match: {skill: "operator/*"}
    effect: approve
  - id: operator-skill-scripts
    action: skill_command
    match: {skill: "operator/*", script: "scripts/**"}
    effect: approve
  - id: repo-skill-scripts
    action: skill_command
    match: {skill: "repo/*", script: "scripts/**"}
    effect: approve
  - id: shell-sh
    action: command
    match: {argv: [sh]}
    effect: approve
    toolchain_env: [CARGO_TARGET_DIR]
  - id: shell-bash
    action: command
    match: {argv: [bash]}
    effect: approve
    toolchain_env: [CARGO_TARGET_DIR]
  - id: shell-pwsh
    action: command
    match: {argv: [pwsh]}
    effect: approve
  - id: shell-powershell
    action: command
    match: {argv: [powershell]}
    effect: approve
  - id: shell-cmd
    action: command
    match: {argv: [cmd]}
    effect: approve
